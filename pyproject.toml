[project]
name = "funblog"
version = "0.5.8"
description = "本地笔记（Markdown/Jupyter Notebook）扫描工具：按目录结构建立分类-文章树并记录到本地 SQLite，再通过 XML-RPC 批量发布/更新到 Typecho 博客"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = ["fundata>=1.0.1", "nbformat>=5.9", "nbconvert>=7.0", "farlog>=1.1.8", "funshell>=1.0.20"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funblog"]
